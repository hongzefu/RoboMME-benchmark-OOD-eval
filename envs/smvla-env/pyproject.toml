# SimpleMemVLA 推理 server 的独立 uv 子项目（v7.5eval 方案 §2.3）。
# - 不是 benchmark 根目录的 workspace 成员：根 pyproject 无 [tool.uv.workspace]，uv 以本目录为项目根。
# - venv 放在本目录 .venv（.gitignore 的 /envs/*/.venv* 不进 git；解释器钉在 NFS 上的 uv managed python，GL 与本机同一个二进制）：
#     E=<eval 仓>/envs/smvla-env/.venv
#     UV_LINK_MODE=copy uv venv --python /nfs/turbo/coe-chaijy-unreplicated/hongzefu/uv-python/cpython-3.10.19-linux-x86_64-gnu/bin/python3.10 "$E"
#     cd envs/smvla-env && UV_PROJECT_ENVIRONMENT="$E" UV_LINK_MODE=copy uv sync --frozen
#     rm -rf ../../third_party/SimpleMemVLA/simplememvla.egg-info   # 可编辑构建留下的，不许弄脏子模块
#   server 解释器：SMVLA_PY="$E/bin/python"
# - 只装策略推理需要的包；不装 sapien / mani_skill（环境一律在 benchmark .venv，口径 3）。
# - constraint-dependencies 为旧官方 venv（SimpleMemVLA/.venv-robomme，E0 所用）的逐包版本，
#   只约束版本、不强行安装：凡被依赖到的包一律取旧 venv 同版本。
[project]
name = "smvla-eval-server"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "simplememvla",
    "openpi-client",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==5.13.1",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "accelerate==1.15.0",
    "numpy==1.26.4",
    "einops==0.8.2",
    "msgpack==1.2.2",
    "websockets==15.0.1",
]

[tool.uv]
