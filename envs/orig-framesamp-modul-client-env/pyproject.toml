# Client environment for re-running the original FrameSamp+Modulation evaluation loop. Identical to
# client-env plus google-generativeai==0.8.6, pinned by the upstream examples/robomme/requirements.txt:
# the upstream eval.py imports gemini (google.generativeai) unconditionally via subgoal_predictor.py.
# Client-side environment shared by the model evaluations: the GroundSG-QwenVL subgoal predictor
# (ms-swift + Qwen3-VL-4B), the PonderPounce client (vla-eval protocol), and Astra's simulator and monitor.
# The simulation stack (mani-skill / sapien / torch) matches the main environment.
# - This is a standalone uv project (not a workspace member) with its own uv.lock; the main .venv is untouched.
# - Setup (the venv lives in this directory and is git-ignored):
#     E=<repo>/envs/orig-framesamp-modul-client-env/.venv
#     UV_LINK_MODE=copy uv venv --python 3.11 "$E"
#     cd envs/orig-framesamp-modul-client-env && UV_PROJECT_ENVIRONMENT="$E" UV_LINK_MODE=copy uv sync --frozen
#   flash-attn==2.8.3 is built separately after the environment exists (--no-build-isolation).
#   Client interpreter: BENCH_PY="$E/bin/python"
[project]
name = "sgeval-orig-framesamp-modul-client-env"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "robomme",
    "openpi-client",
    # ms-swift 3.11.1 needs pillow<12 (through gradio), which conflicts with >=12.1.1 in the main
    # environment's eval-client group; pin 11.3.0 as in Astra's requirements-monitor.txt.
    "pillow==11.3.0",
    "tree>=0.2.4",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "ms-swift==3.11.1",
    "qwen-vl-utils==0.0.14",
    "transformers==4.57.3",
    "peft==0.18.1",
    "imageio",
    "imageio-ffmpeg",
    "vla-eval==0.7.0",
    "psutil",
    "google-generativeai==0.8.6",
]

[tool.uv]
package = false
# Keep the simulation and data-loading stack identical to the main environment's uv.lock
# (sapien 3.0.2, not the 3.0.3 suggested by the Astra docs).
constraint-dependencies = ["sapien==3.0.2", "h5py==3.15.1", "msgpack==1.1.2"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
robomme = { path = "../../third_party/robomme_benchmark", editable = true }
openpi-client = { path = "../../third_party/mme-vla/packages/openpi-client", editable = true }
mani-skill = { git = "https://github.com/YinpeiDai/ManiSkill.git", rev = "07be6fbc66350ddca200abfb0a11b692f078f7fd" }
