<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RoboMME v9 · 逐局对照</title>
  <style>
    :root{--paper:#f6f7f2;--card:#fff;--ink:#172a26;--muted:#6e7a72;--line:#e1e6dc;--green:#246847;--soft:#eaf0e5;--accent:#d4e4a4;--sidebar:250px;
      --s-success:#2e8b57;--s-fail:#c2453a;--s-timeout:#9aa0a6;--s-error:#222;--s-genfail:#7a5ab8;--s-uneval:#8a948b}
    *{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #75a97b;outline-offset:3px}
    .sidebar{width:var(--sidebar);position:fixed;inset:0 auto 0 0;background:#fbfcf8;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
    .brand{padding:26px 22px 18px}.brand-name{font-size:18px;font-weight:750;letter-spacing:-.6px}.brand-caption{font-size:11px;margin-top:4px;color:var(--muted);letter-spacing:1px}
    .search{margin:0 16px 10px;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:12px;background:transparent}
    .task-nav{overflow:auto;padding:0 10px 16px;flex:1}.task-link{width:100%;display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid transparent;background:transparent;text-align:left;border-radius:10px;margin:2px 0}
    .task-link:hover{background:#eff3e9}.task-link[aria-current="page"]{background:var(--soft);border-color:#dce6cf}.task-index{font-size:11px;color:#8c988b;width:18px;font-variant-numeric:tabular-nums}.task-name{font-size:12px;font-weight:650;display:block}.task-id{font-size:10px;color:var(--muted);display:block;margin-top:2px}
    .main{margin-left:var(--sidebar);padding:22px 40px 40px;max-width:1800px}
    .topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.topbar h1{font-size:22px;margin:0;font-weight:620;letter-spacing:-.5px}.topbar p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.7}
    .mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:12px;white-space:nowrap;flex-shrink:0}
    h2.task-title{font-size:24px;margin:22px 0 4px;font-weight:620}.task-sub{font-size:12px;color:var(--muted)}
    .matrix{margin-top:16px;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block;max-width:100%;overflow-x:auto}
    .matrix th,.matrix td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}.matrix th{font-weight:600;color:#3a543f;background:#fafbf7}.matrix td:first-child,.matrix th:first-child{text-align:left}
    .matrix .tier-col{cursor:pointer}.matrix .tier-col.is-current{background:var(--soft)}.matrix .na{color:#b5beb0}
    .tier-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}.tier-tab{border:1px solid var(--line);background:#fff;border-radius:100px;padding:7px 14px;font-size:12px}.tier-tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}.tier-tab:disabled{opacity:.4;cursor:not-allowed}
    .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.filters span{font-size:11px;color:var(--muted);margin-right:4px}.filter{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:11px}.filter[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 7px 5px;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-variant-numeric:tabular-nums}
    .chip[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}.chip.is-flip{background:#fff4e3;border-color:#e3b875}.chip[hidden]{display:none}.dots{display:flex;gap:3px}.dot{width:9px;height:9px;border-radius:50%;background:#ddd}
    .dot.s-unevaluated,.legend i.s-unevaluated{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s-uneval)}.badge.s-unevaluated{background:#eef1ea;color:#4d5a50;border:1px solid #d5dccf}
    .empty.eval-placeholder{background:#f1f3ee;color:#5f6b62;border-top:1px dashed #d5dccf}
    .s-success{background:var(--s-success)}.s-fail{background:var(--s-fail)}.s-timeout{background:var(--s-timeout)}.s-error{background:var(--s-error)}.s-generation_failed{background:var(--s-genfail)}
    .legend{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
    .episode-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}.episode-head h3{margin:0;font-size:17px;font-weight:620}.episode-meta{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
    .sync{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:12px}
    .entry{margin-top:16px}.entry-label{font-size:12px;font-weight:650;color:#3a543f;margin-bottom:8px}.entry-label small{font-weight:400;color:var(--muted);margin-left:6px}
    .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.col{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
    .col-head{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.col-title{font-size:13px;font-weight:650}.badge{font-size:11px;color:#fff;border-radius:6px;padding:2px 8px;white-space:nowrap}
    .col-meta{font-size:11px;color:var(--muted);padding:0 12px 8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .col video{width:100%;display:block;background:#111c19;aspect-ratio:16/9;object-fit:contain}.empty{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:#1b2621;color:#c9d6cb;font-size:12px;line-height:1.7}
    .attempts{display:flex;gap:5px;padding:8px 12px}.attempt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px}.attempt[aria-pressed="true"]{background:var(--ink);color:#fff}
    .notes{margin-top:26px;font-size:11.5px;line-height:1.85;color:#58665c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.notes p{margin:4px 0}
    .rerun-panel{margin:16px 0 4px;background:#fff;border:1px solid #e3b875;border-radius:12px;font-size:12.5px;line-height:1.8}
    .rerun-panel summary{cursor:pointer;padding:12px 16px;font-weight:650;color:#6b4a12;background:#fff4e3;border-radius:12px}
    .rerun-panel[open] summary{border-radius:12px 12px 0 0;border-bottom:1px solid #f0d9ae}
    .rerun-body{padding:10px 16px 14px}.rerun-body p{margin:6px 0}.rerun-body b{color:#172a26}
    .rerun-body code{font-size:11px;background:#f3f5ef;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
    .rr-table{border-collapse:collapse;font-size:11.5px;margin:8px 0;display:block;max-width:100%;overflow-x:auto}
    .rr-table th,.rr-table td{padding:5px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
    .rr-table th{background:#fafbf7;font-weight:600;color:#3a543f}.rr-table tr.is-here td{background:#fff4e3}
    .rr-table a{color:var(--green);cursor:pointer;text-decoration:underline}
    .rr-same{background:#e4efd9;border-radius:4px;padding:0 4px}
    .st-success{color:var(--s-success);font-weight:650}.st-fail{color:var(--s-fail);font-weight:650}.st-timeout{color:#6f757a;font-weight:650}
    .chip.is-rerun{outline:2px dashed #b9812a;outline-offset:1px}
    .verdict{padding:12px 14px;font-size:12px;line-height:1.85}.verdict ul{margin:4px 0;padding-left:18px}.verdict b{color:#172a26}
    .sg-panel{margin:16px 0 4px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px;line-height:1.75}
    .sg-panel summary{cursor:pointer;padding:12px 16px;font-weight:650;color:#3a543f;background:#fafbf7;border-radius:12px}
    .sg-panel[open] summary{border-radius:12px 12px 0 0;border-bottom:1px solid var(--line)}
    .sg-body{padding:10px 16px 14px}.sg-body p{margin:6px 0}.sg-explain{background:#f3f7ee;border-radius:8px;padding:8px 12px}
    .sg-table{border-collapse:collapse;font-size:11.5px;margin:8px 0;display:block;max-width:100%;overflow-x:auto}
    .sg-table th,.sg-table td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
    .sg-table th{background:#fafbf7;font-weight:600;color:#3a543f}.sg-table td.txt{white-space:normal;min-width:220px;max-width:460px}
    .sg-table .is-cur{background:var(--soft)}.sg-table td.v-diff{background:#fde5e1;color:#9c2f25;font-weight:650}.sg-table td.v-near{background:#fff1d6;color:#8a5a0f;font-weight:650}.sg-table td.sg-cls{color:#3a543f;background:#f6f8f2}.sg-table .sg-tip{font-weight:400;color:var(--muted)}.sg-table td.v-new{background:#e1ecfb;color:#1f4f8f;font-weight:650}.v-base{color:#3a543f;font-weight:650}
    .sg-ep{margin-top:16px}
.oracle-link{border-color:#c9dcc0!important;background:#eef5e8}.oracle-link[aria-current="page"]{background:var(--soft);border-color:var(--green)!important}
    .goal{margin-top:10px;font-size:15.5px;line-height:1.75;background:#fff;border:1px solid #cfdcc6;border-left:4px solid var(--green);border-radius:10px;padding:10px 16px;max-width:1100px}.goal ol{margin:4px 0 8px;padding-left:22px;font-weight:600}.goal .k{color:#3a543f;font-size:13px;font-weight:650;margin-top:4px}
    .cfg-kv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.cfg-kv span{background:#f3f5ef;border-radius:6px;padding:2px 8px;font-size:11.5px;font-variant-numeric:tabular-nums}.cfg-kv b{color:#3a543f;margin-right:4px}
    .oracle-comparison .oracle-subtitle{font-size:13px;color:#526357;margin:6px 0 20px}
    .oracle-comparison .oracle-controls{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px}
    .oracle-comparison .oracle-task-filter{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#526357;max-width:100%}
    .oracle-comparison select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:9px 12px;max-width:100%;font-size:14px}
    .oracle-comparison .oracle-count{font-size:13px;color:#526357}
    .oracle-comparison .oracle-fields{border:0;padding:0;margin:0 0 18px;min-width:0}
    .oracle-comparison .oracle-fields legend{font-size:13px;color:#526357;margin-bottom:8px}
    .oracle-comparison .oracle-checks{display:flex;flex-wrap:wrap;gap:10px 18px}
    .oracle-comparison .oracle-checks label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
    .oracle-comparison .oracle-checks input{width:16px;height:16px;margin:0;accent-color:var(--green)}
    .oracle-comparison .oracle-scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--card)}
    .oracle-comparison .oracle-table{width:100%;min-width:940px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:14px;line-height:1.6}
    .oracle-comparison .oracle-table th,.oracle-comparison .oracle-table td{padding:14px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
    .oracle-comparison .oracle-table thead th{background:var(--soft);font-size:13px;font-weight:600;color:#3a543f}
    .oracle-comparison .oracle-table thead th:first-child{width:148px;position:sticky;left:0;z-index:2}
    .oracle-comparison .oracle-table thead th:nth-child(2){width:120px}
    .oracle-comparison .oracle-task{position:sticky;left:0;z-index:1;background:var(--card);font-weight:600;overflow-wrap:anywhere}
    .oracle-comparison .oracle-task a{color:var(--green);text-underline-offset:3px}
    .oracle-comparison .oracle-metric{font-size:13px;font-weight:400;color:#526357;background:#f1f4ed;overflow-wrap:anywhere}
    .oracle-comparison .oracle-table tbody+tbody .oracle-group-start>*{border-top:2px solid var(--line)}
    .oracle-comparison .oracle-table tr:hover td{background:#f6f8f2}
    .oracle-comparison .oracle-config{font-size:13px;line-height:1.8;overflow-wrap:anywhere}
    .oracle-comparison .oracle-value{display:block;font-size:14px;font-weight:650;white-space:nowrap}
    .oracle-comparison .oracle-range,.oracle-comparison .oracle-secondary{display:block;font-size:12px;color:#526357;font-weight:400;margin-top:3px}
    .oracle-comparison .oracle-range{white-space:nowrap}
    .oracle-comparison .oracle-track{height:4px;border-radius:2px;background:var(--soft);margin:8px 0 6px;overflow:hidden}
    .oracle-comparison .oracle-track i{display:block;height:100%;background:var(--green)}
    .oracle-comparison .oracle-track-alt i{background:#436fa0}
    .oracle-comparison .oracle-legend{font-size:13px;color:#526357;line-height:1.7;margin:12px 0}
    .oracle-comparison .oracle-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px;font-size:13px;color:#526357;line-height:1.7}
    .oracle-comparison .oracle-notes strong{color:var(--ink)}.oracle-comparison .oracle-notes p{margin:5px 0}
    .oracle-comparison .oracle-empty{padding:30px;text-align:center;font-size:14px;color:#526357}
    @media(max-width:820px){.oracle-comparison .oracle-notes{grid-template-columns:1fr}.oracle-comparison select{font-size:16px}}
    #matrix{margin-top:20px}
    .oracle-comparison .oracle-tier-button{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:4px 7px;background:var(--card);color:var(--green)}
    .oracle-comparison .oracle-table thead th.oracle-current{background:#dce8d3}
    .oracle-comparison .oracle-tier-button[aria-pressed="true"]{background:var(--green);color:#fff}
    .cfg-sem{margin:4px 0 6px;padding-left:22px;font-size:15.5px;line-height:1.75;font-weight:600}
    .sem-panel{margin:12px 0 4px;background:#fff;border:1px solid #c9b6e4;border-left:4px solid #7a4fb5;border-radius:12px;padding:10px 16px;font-size:12.5px;line-height:1.75}
    .sem-panel h3{margin:0 0 4px;font-size:13.5px;color:#4b2d78}.sem-panel .sem-note{margin:4px 0 8px;color:#3d3550}
    .sem-panel ul{margin:2px 0 8px;padding-left:20px}.sem-panel li{margin:2px 0}.sem-panel code{font-size:11.5px;background:#f4effa;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
    .sem-panel .sem-k{font-weight:650;color:#4b2d78;margin-top:6px}.sem-panel.is-param{border-color:#d5dccf;border-left-color:#9aa596}.sem-panel.is-param h3{color:#3a543f}
    .sem-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;background:#7a4fb5;color:#fff;font-size:10.5px;font-weight:650;vertical-align:1px}
    .sem-ba{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:12px;table-layout:fixed}.sem-ba th,.sem-ba td{border:1px solid #e4dcef;padding:6px 9px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
    .sem-ba th{background:#f7f3fb;color:#4b2d78;font-weight:650}.sem-ba td.sem-arrow{width:28px;text-align:center;color:#7a4fb5;border-left:0;border-right:0}
    .sem-ba .st-removed{background:#fdeceb;text-decoration:line-through;text-decoration-color:#c2453a}.sem-ba .st-added{background:#f1e9fb;font-weight:600}.sem-ba .st-kept{color:#5f6b62}
    .sem-ba ol{margin:0;padding-left:20px}.sem-ba li{margin:1px 0}.sem-ba .sem-none{color:#9aa596}.sem-ba small{display:block;color:#7c897e}
    .sem-coll{display:flex;flex-direction:column;gap:16px}.sem-coll .sem-panel{margin:0}.sem-coll h3 a{color:#4b2d78}
    .sem-link{border-color:#c9b6e4!important;background:#f6f1fb}.sem-link[aria-current="page"]{background:#ece2f7;border-color:#7a4fb5!important}
    .goal li.sem-changed{background:#f4effa;border-radius:6px;padding:0 6px}.sg-table tr.sem-changed td{background:#f4effa}
    .oracle-comparison .sem-yes{color:#4b2d78;font-weight:650}.oracle-comparison .sem-no{color:#7c897e}
    .cfg-raw summary{cursor:pointer;font-size:11px;color:var(--muted)}.cfg-raw pre{font-size:10.5px;background:#f6f8f2;border-radius:8px;padding:8px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
    .outlier-link{margin:0 10px 6px;width:calc(100% - 20px);border:1px solid #f0c4bd!important;background:#fdf1ef}.outlier-link[aria-current="page"]{background:#fde5e1;border-color:#c2453a!important}
    .status-panel{padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:1100px){.cols{grid-template-columns:1fr 1fr}}
    @media(max-width:820px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.is-open{transform:none;box-shadow:12px 0 45px #172a2620}.main{margin-left:0;padding:16px 16px 28px}.mobile-menu{display:inline-block}.cols{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="任务选择">
    <div class="brand"><div class="brand-name">RoboMME v9</div><div class="brand-caption">生成演示 · 两策略评估</div></div>
    <input class="search" id="task-search" type="search" placeholder="查找任务…" autocomplete="off" aria-label="搜索任务">
    <button class="task-link outlier-link" id="outlier-link" type="button" hidden><span class="task-index">★</span><span><span class="task-name">超出 xhard0 范围 &gt;15% 合集</span><span class="task-id" id="outlier-count"></span></span></button>
    <button class="task-link outlier-link sem-link" id="semantic-link" type="button" hidden><span class="task-index">≠</span><span><span class="task-name">语义调整合集</span><span class="task-id" id="semantic-count"></span></span></button>
    <button class="task-link outlier-link oracle-link" id="overall-link" type="button" hidden><span class="task-index">%</span><span><span class="task-name">总体成功率</span><span class="task-id">xhard1～5 · 800 局 · 不分档</span></span></button>
    <button class="task-link outlier-link oracle-link" id="oracle-link" type="button" hidden><span class="task-index">∑</span><span><span class="task-name">各档总表</span><span class="task-id">配置 · oracle 长度 · 成功率</span></span></button>
    <nav class="task-nav" id="task-nav" aria-label="全部任务"></nav>
  </aside>
  <main class="main" id="content">
    <header class="topbar">
      <div><h1>v9 逐局对照</h1><p>每一局并排展示生成演示与 SimpleMemVLA、MME-VLA 两个策略的评估结果与视频。xhard1～5 为 V9 交付集（16 任务 × 50 局 = 800 局）的双模型评估（执行段 1600 步截断；其中 720 局与 V8 逐字节相同、直接复用 V8 评估，80 局新评）；xhard0 为官方 hard 12 局对照（不计入 800），沿用 V8 阶段 3′ 两路线评估，分新入口（robomme_hard）与旧入口（官方 robomme）两行。</p></div>
      <button class="mobile-menu" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">切换任务</button>
    </header>
    <div class="status-panel" id="status-panel" role="status">正在载入…</div>
    <section id="outlier-section" hidden></section>
    <section id="overall-section" class="oracle-comparison" hidden></section>
    <section id="oracle-section" class="oracle-comparison" hidden></section>
    <section id="semantic-section" hidden></section>
    <section id="task-section" hidden>
      <h2 class="task-title" id="task-title"></h2><div class="task-sub" id="task-sub"></div>
      <div id="matrix" class="oracle-comparison" aria-label="本任务各档配置、GT 长度与评估位"></div>
      <div class="tier-tabs" id="tier-tabs" role="group" aria-label="档位"></div>
      <div class="sem-panel" id="sem-panel" hidden></div>
      <div class="filters" id="filters" role="group" aria-label="筛选"></div>
      <div class="legend" id="legend"></div>
      <details class="rerun-panel" id="rerun-panel" open hidden></details>
      <div class="chips" id="chips" role="group" aria-label="局号"></div>
      <section id="episode"></section>
      <div class="notes" id="notes"></div>
    </section>
  </main>
  <script>
    'use strict';
    const el = id => document.getElementById(id);
    const S = { sg: null, cat: null, task: null, tier: null, ep: null, filter: 'all' };
    const STATUS_ZH = { success: '成功', fail: '失败', timeout: '超时', error: '错误', unevaluated: '未评估', generation_failed: '生成失败' };

    // ---- 总体成功率：xhard1～5 全部交付局（不含 xhard0）按策略合计，不分档；逐任务也按同一口径 ----
    // 数据直接由 catalog.tasks[*].tiers[tier].rates.new 累加（终态 success/fail/timeout/error），分母为该格局数。
    function overallStats() {
      const per = [], total = {};
      policies().forEach(p => { total[p.id] = { success: 0, fail: 0, timeout: 0, error: 0, n: 0 }; });
      S.cat.tasks.forEach(task => {
        const row = { id: task.id, name: task.name, byPolicy: {} };
        policies().forEach(p => { row.byPolicy[p.id] = { success: 0, fail: 0, timeout: 0, error: 0, n: 0 }; });
        Object.entries(task.tiers).forEach(([tier, cell]) => {
          if (tier === 'xhard0') return;
          const n = cell.episodes.length;
          policies().forEach(p => {
            const c = ((cell.rates || {}).new || {})[p.id] || {}, r = row.byPolicy[p.id];
            FINAL.forEach(k => { r[k] += c[k] || 0; });
            r.n += n;
          });
        });
        policies().forEach(p => { const r = row.byPolicy[p.id], t = total[p.id]; FINAL.forEach(k => { t[k] += r[k]; }); t.n += r.n; });
        per.push(row);
      });
      return { per, total };
    }

      const tb = node('tbody');

        td.append(node('span', 'oracle-range', t.success + ' / ' + t.n + ' 局成功')); tr.append(td); tb.append(tr);
      });
      table.append(tb); scroll.append(table); box.append(scroll);
      box.append(node('h2', 'task-title', '逐任务（同样不分档）'));
      const scroll2 = node('div', 'oracle-scroll'); const t2 = node('table', 'oracle-table'); t2.style.minWidth = '640px';
      const th2 = node('thead'); const hr2 = node('tr'); hr2.append(node('th', '', '任务'), node('th', '', '局数'));
      policies().forEach(p => hr2.append(node('th', '', p.label + ' 成功率'))); th2.append(hr2); t2.append(th2);
      const tb2 = node('tbody');
      per.forEach(row => {
        const tr = node('tr'); const th = node('th', 'oracle-task');
        const a = node('a', '', row.name); a.href = '#task=' + row.id; a.addEventListener('click', ev => { ev.preventDefault(); select(row.id); });
        th.append(a, node('span', 'oracle-secondary', row.id)); tr.append(th);
        const n0 = row.byPolicy[policies()[0].id].n; tr.append(node('td', '', String(n0)));
        policies().forEach((p, i) => {

          const track = node('div', 'oracle-track' + (i === 1 ? ' oracle-track-alt' : '')); track.setAttribute('aria-hidden', 'true');
          const bar = node('i'); bar.style.width = (r.n ? 100 * r.success / r.n : 0) + '%'; track.append(bar); td.append(track);

      box.append(node('p', 'oracle-legend', '口径：成功率 = 成功局数 / 局数，只计新入口（robomme_hard）终态；各档拆分见「各档总表」，逐局见各任务页。'));
    }
    // 总表与任务页共用同一渲染逻辑；勾选状态分开保存。
    function renderComparison(box, onlyTask = null) {
      box.textContent = '';
      const metrics = [

        ...policies().map(p => ['policy-' + p.id, p.label + ' 成功率']), ['n', '长度样本 · 局'],

      const metricState = onlyTask ? 'taskMetrics' : 'oracleMetrics';
      if (!S[metricState]) S[metricState] = new Set(metrics.map(([id]) => id));

      controls.append(taskLabel, count);
      if (!onlyTask) box.append(controls);
      const fields = node('fieldset', 'oracle-fields');

      const checks = node('div', 'oracle-checks');
      metrics.forEach(([id, title]) => {

      const scroll = node('div', 'oracle-scroll');
      scroll.tabIndex = 0; scroll.setAttribute('role', 'region');

      box.append(node('p', 'oracle-legend', 'xhard0～5 同时展示。GT = ground truth；长度第一行为均值，第二行为最小～最大。成功率 = 成功局数 / 本格局数；xhard1～5 来自 V9 双模型评估（720 局复用 V8、80 局新评，1600 步截断），xhard0 来自 V8 阶段 3′（新入口 = hard 路线，上限 1300）。'));

        note('长度口径', 'GT 长度取成功生成的 HDF5。demo 是 info/is_video_demo 标记的视频演示帧；execution = 总帧数 − demo；总长度包含视频演示。长度样本数与评估分母分别展示。'),
        note('配置来源与例外', 'xhard0 为官方 hard，各局配置随机；xhard1～5 的配置逐局取自 V9 冻结规格，格内列出实际取值（RouteStick／PatternLock 为区间，附取值分布）。VideoPlaceOrder 的 2 局官方生成失败不计入长度。点击任务名可进入逐局页面。')
      );
      box.append(notes);
      taskFilter.addEventListener('change', () => { S.oracleTask = taskFilter.value; drawTable(); });
      function drawTable() {
        const tasks = onlyTask ? [onlyTask] : S.cat.tasks.filter(t => S.oracleTask === 'all' || t.id === S.oracleTask);
        const selected = metrics.filter(([id]) => S[metricState].has(id));

        scroll.replaceChildren();
        if (!selected.length) {

          empty.setAttribute('role', 'status'); scroll.append(empty); return;
        }
        const table = node('table', 'oracle-table');
        const head = node('thead'); const header = node('tr');
        ['任务', '对比项', ...S.cat.tiers].forEach((title, i) => {

                  if (c.changed) td.append(node('span', 'oracle-range', `goal +${c.goal_added.length}/−${c.goal_removed.length} · subgoal +${c.sub_added.length}/−${c.sub_removed.length}`)); }
              }

                td.append(cfg);

                const old = metric.startsWith('old-policy-');
                const policyId = metric.slice(old ? 'old-policy-'.length : 'policy-'.length);
                const counts = (cell.rates || {})[old ? 'old' : 'new']?.[policyId], n = cell.episodes.length;
                if (old && tier !== 'xhard0') td.append(node('span', 'oracle-secondary', '—'));
                else if (!counts || !n) { const u = node('span', 'oracle-secondary eval-uneval', '未评估'); td.append(u); }
                else {

                  track.setAttribute('aria-hidden', 'true');

                }
              } else if (!gt) td.append(node('span', 'oracle-secondary', '未记录'));
              else if (metric === 'max_steps') td.append(node('span', 'oracle-value', gt.max_steps == null ? '—' : String(gt.max_steps)));
              else if (metric === 'n') td.append(node('span', 'oracle-value', gt.n == null ? '未记录' : String(gt.n)));
              else {

                td.append(node('span', 'oracle-value', String(gt[prefix + 'mean'])),

    function showView(name) {
      S.task = null; el('task-section').hidden = true;
      ['outlier', 'overall', 'oracle', 'semantic'].forEach(v => { el(v + '-section').hidden = v !== name; if (v === name) el(v + '-link').setAttribute('aria-current', 'page'); else el(v + '-link').removeAttribute('aria-current'); });

      renderNav(); if (name === 'outlier') renderOutliers(); else if (name === 'semantic') renderSemanticAll(); else if (name === 'overall') renderOverall(); else renderOracle();
    }

    // ---- xhard1～5 相对 xhard0 的 goal／subgoal 语义调整（semantic_diff.py → /api/semantic）----
    const semCell = (task, tier) => (((S.sem || {}).tasks || {})[task] || {}).tiers?.[tier];
    const semEp = (task, tier, idx) => ((((S.sem || {}).episodes || {})[task] || {})[tier] || {})[String(idx)];
    // 任务页不再显示语义调整面板（用户 2026-10-02「不要写在这里了」）：调整前后对照只在「语义调整合集」页；容器保留并隐藏
    function renderSemPanel() {
      const box = el('sem-panel'); box.textContent = ''; box.className = 'sem-panel'; box.hidden = true;
    }
    // 调整前（xhard0）／调整后（本档）对照：goal 全部句式、subgoal 类型配对、示例局的 goal 与整条 subgoal 序列
    function semDetail(tier, c) {
      const wrap = node('div', 'sem-detail');
      const head = (a, b) => { const tr = node('tr'); tr.append(node('th', '', a), node('th', '', b)); return tr; };
      const STATE = { kept: '保留', removed: '去掉', added: '新增' };
      const goalCol = items => { const td = node('td'); if (!items.length) td.append(node('span', 'sem-none', '（无）'));
        items.forEach(it => { const d = node('div', 'st-' + it.state); d.append(node('code', '', it.tpl), node('small', '', `${STATE[it.state]} · 例：${it.example}`)); td.append(d); }); return td; };
      wrap.append(node('div', 'sem-k', 'task goal 句式（〈〉为参数占位；划线 = 调整后不再出现，紫底 = 调整后新增）'));
      const gt = node('table', 'sem-ba'); gt.append(head('调整前 · xhard0', `调整后 · ${tier}`));
      const gr = node('tr'); gr.append(goalCol(c.goal_before || []), goalCol(c.goal_after || [])); gt.append(gr); wrap.append(gt);
      if ((c.sub_pairs || []).length) {
        wrap.append(node('div', 'sem-k', 'subgoal 类型（调整前 → 调整后）'));
        const st = node('table', 'sem-ba'); st.append(head('调整前 · xhard0', `调整后 · ${tier}`));
        c.sub_pairs.forEach(pr => {
          const tr = node('tr');
          [[pr.before, 'removed'], [pr.after, 'added']].forEach(([x, cls]) => {
            const td = node('td'); if (!x) td.append(node('span', 'sem-none', cls === 'removed' ? '（xhard0 没有这一段）' : '（调整后去掉，无对应）'));
            else { const d = node('div', 'st-' + cls); d.append(node('code', '', x.tpl), node('small', '', '例：' + x.example)); td.append(d); }
            tr.append(td);
          });
          st.append(tr);
        });
        wrap.append(st);
      }
      const ex = c.example;
      if (ex) {
        wrap.append(node('div', 'sem-k', `示例：xhard0 第 ${ex.before_ep} 局 → ${tier} 第 ${ex.after_ep} 局（task goal 与整条 subgoal 序列）`));
        const et = node('table', 'sem-ba'); et.append(head(`调整前 · xhard0 第 ${ex.before_ep} 局`, `调整后 · ${tier} 第 ${ex.after_ep} 局`));
        const seqCol = (goal, gnew, seq, snew) => {
          const td = node('td');
          td.append(node('small', '', 'task goal'));
          const g = node('ol'); goal.forEach((x, i) => { const li = node('li', gnew && gnew[i] ? 'st-added' : '', x); g.append(li); }); td.append(g);
          td.append(node('small', '', 'subgoal 序列'));
          const o = node('ol'); seq.forEach((x, i) => o.append(node('li', snew && snew[i] ? 'st-added' : '', x))); td.append(o);
          return td;
        };
        const er = node('tr'); er.append(seqCol(ex.before_goal, null, ex.before_seq, null), seqCol(ex.after_goal, ex.after_goal_new, ex.after_seq, ex.after_seq_new));
        et.append(er); wrap.append(et);

    // ---- 语义调整合集：全部有调整的格，按任务排列，每格调整前后对照 ----

    function epMatches(ep) {
      const sts = policies().map(p => evalStatus(ep, 'new', p.id));
      const done = sts.every(evaluated);  // 成败筛选只看两策略都已评估的局
      const [a, b] = sts.map(ok);
      switch (S.filter) {
        case 'both': return done && a && b;
        case 'split': return done && a !== b;
        case 'none': return done && !a && !b;
        case 'flip': return !!ep.flip && Object.values(ep.flip).some(Boolean);
        case 'rerun': return !!ep.rerun;
        case 'uneval': return sts.some(st => !evaluated(st));
        default: return true;
      }
    }

    function genColumn(g, tier, rec) {

    function evalColumn(p, r) {

    function renderEpisode() {

        const semE = semEp(S.task, S.tier, ep.idx);
        const ol = node('ol'); (rec.goal || []).forEach((x, i) => {
          const li = node('li', '', x);
          if (semE && semE.goal[i]) { li.classList.add('sem-changed'); li.append(node('span', 'sem-tag', '语义调整')); li.title = '该措辞的句式 xhard0 没有（见上方「语义调整」说明）'; }
          ol.append(li);
        }); if (!(rec.goal || []).length) ol.append(node('li', '', '空 h5，无 task goal'));
        g.append(ol);
        g.append(node('div', 'k', S.tier === 'xhard0'

      } else {
        const g = node('div', 'goal');
        g.append(node('div', 'k', `任务配置（${S.tier}${S.tier === 'xhard0' ? '' : '，本局取自 V9 冻结规格'}）· 逐段数据缺失（subgoals.json 未载入）`));
        g.append(episodeConfig(ep, null));

      }
      const sync = node('button', 'sync', '同步播放'); sync.type = 'button'; sync.id = 'sync-play';
      sync.title = '同步播放本局全部视频（生成演示与两策略评估）';
      sync.addEventListener('click', () => {
        const vids = [...box.querySelectorAll('video')];

        vids.forEach(v => v.play().catch(() => {}));

      const entries = S.tier === 'xhard0' ? ['new', 'old'] : ['new'];
      entries.forEach(entry => {
        const sec = node('div', 'entry'); const label = node('div', 'entry-label', ENTRY_ZH[entry]);
        if (entry === 'old') {
          const flips = policies().filter(p => ep.flip && ep.flip[p.id]).map(p => p.label);
          if (flips.length) label.append(node('small', '', `与新入口成败不同：${flips.join('、')}${ep.rerun ? '（原因已查明，见下方「同卡重跑」）' : ''}`));
        }
        sec.append(label);
        const cols = node('div', 'cols');
        cols.append(genColumn(ep.gen[entry], S.tier, ((S.sg && S.sg.episodes && S.sg.episodes[S.task] || {})[S.tier] || {})[String(ep.idx)]));
        policies().forEach(p => cols.append(evalColumn(p, (ep.eval[entry] || {})[p.id])));
        sec.append(cols); box.append(sec);
      });
      if (ep.rerun) box.append(rerunSection(ep));
      box.append(subgoalEpisode(ep));
    }

    // ---- 逐段 subgoal 帧数（subgoal_lengths.py）----
    const VERDICT_CLS = { '不一致': 'v-diff', '新增': 'v-new', '基准': 'v-base' };
    const fmtCell = c => c ? `${c.median}（${c.min}～${c.max}，${c.n} 段）` : '—';
    function sgRow(tpl, kind) {
      return ((S.sg.summary || {})[S.task] || []).find(r => r.tpl === tpl && r.kind === kind);
    }
    // 逐段判定：本段帧数落在 xhard0 同类段的最小～最大内为「在范围内」；超出时按超出量占越过的那个边界的比例分两级
    function segVerdict(task, tier, s) {
      const r = ((S.sg.summary || {})[task] || []).find(x => x.tpl === s.tpl && x.kind === s.kind), base = r && r.tiers.xhard0;
      if (tier === 'xhard0') return { v: '基准', cls: '', tip: '', base };
      if (!base) return { v: '新增（xhard0 无此类）', cls: 'v-new', tip: '', base };
      if (s.frames >= base.min && s.frames <= base.max) return { v: '在范围内', cls: '', tip: '', base };
      const edge = s.frames < base.min ? base.min : base.max, over = Math.abs(s.frames - edge), pct = 100 * over / edge;
      const tip = `${s.frames < base.min ? '比最小值短' : '比最大值长'} ${over} 帧（${pct.toFixed(1)}%）`;
      return pct < 15 ? { v: '不在范围内但小于15%', cls: 'v-near', tip, base, pct } : { v: '不在范围内且大于15%', cls: 'v-diff', tip, base, pct };
    }
    function outliers() {
      const out = [];
      if (!S.sg || !S.sg.episodes) return out;
      S.cat.tasks.forEach(t => Object.keys(t.tiers).forEach(tier => {
        if (tier === 'xhard0') return;
        const recs = (S.sg.episodes[t.id] || {})[tier] || {};
        Object.entries(recs).forEach(([idx, rec]) => (rec.new || []).forEach((s, i) => {
          const r = segVerdict(t.id, tier, s);
          if (r.v === '不在范围内且大于15%') out.push({ task: t.id, tier, idx: Number(idx), seed: rec.seed, seg: i + 1, s, r });
        }));
      }));
      return out;
    }
    function renderOutliers() {
      const box = el('outlier-section'); box.textContent = '';
      const rows = outliers();
      box.append(node('h2', 'task-title', `超出 xhard0 范围 >15% 合集（${rows.length} 段）`));
      box.append(node('div', 'task-sub', '列出 xhard1～5 全部 16 任务中，本段帧数落在 xhard0 同类 subgoal 最小～最大范围之外、且超出量占越过的边界值 ≥15% 的段。点任务名跳到该局。'));
      const byTask = {}; rows.forEach(x => { byTask[x.task] = (byTask[x.task] || 0) + 1; });
      box.append(node('p', 'task-sub', Object.entries(byTask).map(([k, n]) => `${k} ${n}`).join(' · ') || '无'));
      const t = node('table', 'sg-table'); const h = node('tr');
      ['任务', '档', '局', 'seed', '第几段', 'subgoal', '首次／后续', '帧数', '所属同类', 'xhard0 同类中位（范围）', '偏离'].forEach(x => h.append(node('th', '', x)));
      t.append(h);
      rows.forEach(x => {
        const tr = node('tr'); const a = node('a', '', x.task); a.href = `#task=${x.task}&tier=${x.tier}&ep=${x.idx}`;
        const td0 = node('td'); td0.append(a); tr.append(td0);
        [x.tier, String(x.idx), String(x.seed), String(x.seg)].forEach(v => tr.append(node('td', '', v)));
        tr.append(node('td', 'txt', x.s.text), node('td', '', x.s.kind), node('td', '', String(x.s.frames)), node('td', 'txt sg-cls', `${x.s.tpl}（${x.s.kind}）`),
          node('td', '', `${x.r.base.median}（${x.r.base.min}～${x.r.base.max}）`), node('td', 'v-diff', x.r.tip));
        t.append(tr);
      });
      box.append(t);
    }
    function showOutliers() { showView('outlier'); }

    // ---- 任务配置：一律取目录数据（v8 冻结规格逐局抽值，catalog.tiers[tier].config 与 ep.config），页面不写死任何定值 ----
    // xhard0 能从本局 subgoal 数出的维度：维度名 → 计数函数
    const X0_COUNT = {
      PickXtimes: { '抓放次数': s => s.filter(x => x.text.startsWith('pick up')).length },
      BinFill: { '投入块数': s => s.filter(x => x.text.startsWith('pick up')).length },
      SwingXtimes: { '摆动轮数': s => s.filter(x => x.text.includes('right-side')).length },
      PickHighlight: { '抓取数': s => s.filter(x => x.text.includes('highlighted')).length },
      VideoRepick: { '重抓': s => s.filter(x => x.text.includes('correct cube')).length },
    };
    const fmtValues = (values, dist) => {
      if (!values.length) return '未记录';
      if (values.length === 1) return String(values[0]);
      const d = Object.entries(dist || {}).map(([k, n]) => `${k}×${n}`).join('、');
      return `${values[0]}～${values[values.length - 1]}（${d}）`;
    };
    function tierConfigItems(task, tier) {
      const c = ((S.cat.tasks.find(t => t.id === task) || {}).tiers || {})[tier];
      if (!c || !c.config) return [];
      return c.config.map(it => it.dim ? { dim: it.dim, values: it.values, text: `${it.dim}：${fmtValues(it.values, it.dist)}` } : { dim: null, values: [], text: it.text });
    }
    function tierConfig(task, tier) { return tierConfigItems(task, tier).map(it => it.text); }
    function episodeConfig(ep, rec) {
      const cl = node('ul', 'cfg-sem');
      if (S.tier === 'xhard0') {
        const f = X0_COUNT[S.task] || {};
        const segs = rec && rec.new;
        Object.entries(f).forEach(([dim, fn]) => cl.append(node('li', '', segs && segs.length ? `${dim}：本局 ${fn(segs)}（官方随机）` : `${dim}：官方随机，本局未记录`)));
        if (!cl.children.length) cl.append(node('li', '', '官方 hard 原任务配置（每局随机）'));
        return cl;
      }
      const cfg = ep.config || {};
      const dims = Object.keys(cfg);
      if (!dims.length) tierConfig(S.task, S.tier).forEach(x => cl.append(node('li', '', x)));
      dims.forEach(dim => { const li = node('li', '', `${dim}：${cfg[dim] ?? '未记录'}`); li.dataset.dim = dim; li.dataset.value = JSON.stringify(cfg[dim]); cl.append(li); });
      return cl;
    }

    function subgoalEpisode(ep) {
      const wrap = node('div', 'sg-ep');
      const rec = S.sg && S.sg.episodes && ((S.sg.episodes[S.task] || {})[S.tier] || {})[String(ep.idx)];
      if (!rec) return wrap;
      const segs = rec.new || [];
      const two = S.tier === 'xhard0';
      const same = two && JSON.stringify(rec.new) === JSON.stringify(rec.old);
      wrap.append(node('div', 'entry-label', `本局逐段 subgoal 帧数（共 ${segs.length} 段，${segs.reduce((a, s) => a + s.frames, 0)} 帧）`));
      if (two) wrap.lastChild.append(node('small', '', same ? '新入口与官方旧入口逐段完全相同' : '新入口与官方旧入口逐段不同！'));
      if (!segs.length) { wrap.append(node('div', 'notes', '空 h5（官方原版即生成失败），没有 subgoal。')); return wrap; }
      const t = node('table', 'sg-table'); const h = node('tr');
      ['#', 'subgoal', '帧数', '首次／后续', '所属同类', 'xhard0 同类中位（范围）', '本段与 xhard0 范围比'].forEach(x => h.append(node('th', '', x)));
      t.append(h);
      segs.forEach((s, i) => {
        const r = sgRow(s.tpl, s.kind), base = r && r.tiers.xhard0, mine = r && r.tiers[S.tier];
        const tr = node('tr');
        tr.append(node('td', '', String(i + 1)), node('td', 'txt', s.text), node('td', '', String(s.frames)), node('td', '', s.kind), node('td', 'txt sg-cls', `${s.tpl}（${s.kind}）`),
          node('td', '', base ? `${base.median}（${base.min}～${base.max}）` : 'xhard0 无此类'));
        const { v, cls, tip } = segVerdict(S.task, S.tier, s);
        const td = node('td', cls, v); if (tip) { td.title = tip; td.append(node('small', 'sg-tip', `　${tip}`)); }
        tr.append(td);
        const semE = semEp(S.task, S.tier, ep.idx);
        if (semE && semE.sub[i]) { tr.classList.add('sem-changed'); tr.children[1].append(node('span', 'sem-tag', '语义调整')); }
        t.append(tr);
      });
      wrap.append(t);
      return wrap;
    }

    // ---- FrameSamp+Modulation 同卡重跑（12.248）----
    const stSpan = r => { const x = node('span', 'st-' + r.status, `${STATUS_ZH[r.status]}/${r.steps} 步`); return x; };
    const same = (a, b) => a && b && a.status === b.status && a.steps === b.steps;
    function rerunFacts(ep) {
      const o0 = ep.eval.old.mmevla, n0 = ep.eval.new.mmevla, o1 = ep.rerun.mmevla.old, n1 = ep.rerun.mmevla.new;  // 历史数据键：FrameSamp+Modulation 的页面 ID（site_catalog.EVAL_POLICY）
      const facts = [];
      facts.push(['旧入口自己重跑', o0.status === o1.status ? `成败不变（${STATUS_ZH[o0.status]}）` : `${STATUS_ZH[o0.status]} → ${STATUS_ZH[o1.status]}，自己就复现不了`]);
      facts.push(['新入口自己重跑', n0.status === n1.status ? `成败不变（${STATUS_ZH[n0.status]}）` : `${STATUS_ZH[n0.status]} → ${STATUS_ZH[n1.status]}，自己就复现不了`]);
      facts.push(['同卡重跑后两入口', o1.status === n1.status ? `成败相同（都是${STATUS_ZH[o1.status]}）` : `仍然不同（旧 ${STATUS_ZH[o1.status]}、新 ${STATUS_ZH[n1.status]}）`]);
      const twins = [];
      if (same(n1, o0)) twins.push('新入口重跑 = 旧入口原来那次');
      if (same(o1, n0)) twins.push('旧入口重跑 = 新入口原来那次');
      if (same(n1, o1)) twins.push('同卡重跑两入口彼此相同');
      if (same(o1, o0) && !twins.length) twins.push('旧入口两次完全相同');
      if (same(n1, n0) && twins.length < 2 && !twins.includes('旧入口两次完全相同')) twins.push('新入口两次完全相同');
      if (twins.length) facts.push(['成败与步数逐步相同', twins.join('；')]);
      return facts;
    }
    function rerunSection(ep) {
      const sec = node('div', 'entry');
      const label = node('div', 'entry-label', '同卡重跑 · 只重跑 MME-VLA');
      label.append(node('small', '', `${S.cat.rerun11.when} · ${S.cat.rerun11.where}`));
      sec.append(label);
      const cols = node('div', 'cols');
      const card = node('div', 'col'); const h = node('div', 'col-head'); h.append(node('span', 'col-title', '这一局的四次结果')); card.append(h);
      const v = node('div', 'verdict');
      const t = node('table', 'rr-table');
      const hr = node('tr'); ['', '原评估', '同卡重跑'].forEach(x => hr.append(node('th', '', x))); t.append(hr);
      [['旧入口（官方 robomme）', ep.eval.old.mmevla, ep.rerun.mmevla.old], ['新入口（robomme_hard）', ep.eval.new.mmevla, ep.rerun.mmevla.new]].forEach(([name, a, b]) => {  // 历史数据键：FrameSamp+Modulation 的页面 ID（site_catalog.EVAL_POLICY）
        const tr = node('tr'); tr.append(node('td', '', name));
        [a, b].forEach(r => { const td = node('td'); td.append(stSpan(r)); tr.append(td); }); t.append(tr);
      });
      v.append(t);
      const ul = node('ul');
      rerunFacts(ep).forEach(([k, val]) => { const li = node('li'); li.append(node('b', '', k + '：'), document.createTextNode(val)); ul.append(li); });
      v.append(ul);
      v.append(node('div', '', '结论见上方「FrameSamp+Modulation 两个入口为什么会有 11 局成败相反？」面板。'));
      card.append(v); cols.append(card);
      [['new', '新入口重跑 · MME-VLA'], ['old', '旧入口重跑 · MME-VLA']].forEach(([entry, title]) => {
        const r = ep.rerun.mmevla[entry];  // 历史数据键：FrameSamp+Modulation 的页面 ID（site_catalog.EVAL_POLICY）
        const col = node('div', 'col'); const hd = node('div', 'col-head');
        hd.append(node('span', 'col-title', title), node('span', 'badge s-' + r.status, STATUS_ZH[r.status]));
        col.append(hd, node('div', 'col-meta', `步数 ${r.steps} / 上限 ${r.max_steps}`), videoEl(r.media));
        cols.append(col);
      });
      sec.append(cols);
      return sec;
    }
    function rerunRows() {
      const rows = [];
      S.cat.tasks.forEach(t => { const c = t.tiers.xhard0; if (!c) return; c.episodes.forEach(ep => { if (ep.rerun) rows.push([t, ep]); }); });
      return rows;
    }
    function renderRerunPanel() {
      const box = el('rerun-panel');
      if (S.tier !== 'xhard0' || !S.cat.rerun11) { box.hidden = true; return; }
      box.hidden = false; box.textContent = '';
      box.append(node('summary', '', 'FrameSamp+Modulation 两个入口为什么会有 11 局成败相反？——已查明：FrameSamp+Modulation 策略自己的计算每次都有细微差别，入口没有问题'));
      const b = node('div', 'rerun-body');
      const P = html => { const p = node('p'); p.innerHTML = html; b.append(p); };
      P('<b>现象。</b>xhard0 的 192 局用两个入口各评了一次：旧入口（官方 <code>robomme</code>，<code>dataset="test"</code>）与新入口（<code>robomme_hard</code>，<code>dataset="ood"</code>）。两个入口建出的环境已证明逐字节相同（192/192）。SimpleMemVLA 两入口成败逐局相同，<b>MME-VLA 却有 11 局成败相反</b>（5 局成→败、5 局败→成、1 局超时→成，总数 50 对 51 几乎持平）。');
      P('<b>两种可能。</b>A：FrameSamp+Modulation 自己不稳定——GPU／JAX 数值在不同卡、不同编译历史下有微小差异，被策略放大。B：两个入口喂给 FrameSamp+Modulation 的输入有系统差别——那就是 benchmark 的 bug。');
      P('<b>怎么验证。</b>在同一张 A40 上，先用旧入口、再用新入口，把这 11 局各重跑一次（11 局 × 2 入口 = 22 局）。代码、模型、服务端种子（7）都和原评估相同。同入口重跑就变了 → A；各自稳定、两入口仍不同 → B。');
      P('<b>结果。</b>① 同一个入口自己就复现不了：旧入口 5／11 局、新入口 4／11 局与自己原来成败不同。② 同一条轨迹会在另一个入口原样出现，连步数都逐步相同（下表绿底）：例如 ButtonUnmaskSwap 新入口重跑「成功/458 步」＝旧入口原来那次；VideoPlaceButton 新入口重跑「失败/178」＝旧入口两次。能跑出完全相同的轨迹，说明两个入口给策略的输入没有区别。③ 同一张卡上两入口仍有 6 局不同，说明不稳定不只来自换节点。');
      P('<b>结论：A 成立，B 不成立。</b>benchmark 的新入口没有 bug；FrameSamp+Modulation 在这些局上的成败接近随机，单次成功率本身带几个百分点的波动。MoveCube、SwingXtimes、VideoUnmaskSwap 552300 两次都是「两入口不同」，但每入口只有 2 个样本，不足以单独判为 B。');
      P(`判定行：<code>${S.cat.rerun11.parity}</code>（留档 <code>docs/validation/newtask-v7/README.md</code> ⑥，提交 ${S.cat.rerun11.commit}）`);
      const t = node('table', 'rr-table');
      const hr = node('tr'); ['任务', '局', 'seed', '旧入口 原评估', '旧入口 重跑', '新入口 原评估', '新入口 重跑'].forEach(x => hr.append(node('th', '', x))); t.append(hr);
      rerunRows().forEach(([task, ep]) => {
        const tr = node('tr'); if (task.id === S.task && ep.idx === S.ep) tr.className = 'is-here';
        const a = node('a', '', `${task.id}`); a.addEventListener('click', () => select(task.id, 'xhard0', ep.idx));
        const td0 = node('td'); td0.append(a); tr.append(td0, node('td', '', `第 ${ep.idx} 局`), node('td', '', String(ep.seed)));
        const cells = [ep.eval.old.mmevla, ep.rerun.mmevla.old, ep.eval.new.mmevla, ep.rerun.mmevla.new];  // 历史数据键：FrameSamp+Modulation 的页面 ID（site_catalog.EVAL_POLICY）
        cells.forEach((r, i) => {
          const td = node('td'); const sp = stSpan(r);
          if (cells.some((q, j) => j !== i && same(q, r))) sp.classList.add('rr-same');
          td.append(sp); tr.append(td);
        });
        t.append(tr);
      });
      b.append(t);
      b.append(node('p', '', '绿底 = 这一格与同一行另一格的成败和步数完全相同（同一条轨迹）。点任务名跳到该局，下方「同卡重跑」一节可以直接看四段录像中的两段重跑。'));
      box.append(b);
    }

    function renderNotes() {
      const n = el('notes'); n.textContent = '';
      Object.values(S.cat.notes || {}).forEach(t => n.append(node('p', '', t)));
    }

    function select(task, tier, ep) {
      el('outlier-section').hidden = true; el('overall-section').hidden = true; el('oracle-section').hidden = true; el('semantic-section').hidden = true; el('task-section').hidden = false; el('outlier-link').removeAttribute('aria-current'); el('overall-link').removeAttribute('aria-current'); el('oracle-link').removeAttribute('aria-current'); el('semantic-link').removeAttribute('aria-current');
      S.task = task;
      const t = taskObj();
      S.tier = tier && t.tiers[tier] ? tier : (t.tiers[S.tier] ? S.tier : Object.keys(t.tiers)[0]);
      const eps = cell().episodes;
      S.ep = ep && eps.some(e => e.idx === ep) ? ep : eps[0].idx;
      if ((S.filter === 'flip' || S.filter === 'rerun') && S.tier !== 'xhard0') S.filter = 'all';
      writeHash();
      el('task-title').textContent = `${t.name} · ${t.id}`;
      const counts = Object.entries(t.tiers).map(([k, v]) => `${k} ${v.episodes.length} 局`).join(' · ');
      el('task-sub').textContent = counts;
      renderNav(); renderMatrix(); renderTabs(); renderSemPanel(); renderFilters(); renderRerunPanel(); renderChips(); renderEpisode();
    }

    async function load() {
      try {
        const res = await fetch('/api/catalog', { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        S.cat = await res.json();
        try { const r2 = await fetch('/api/subgoals', { cache: 'no-store' }); S.sg = r2.ok ? await r2.json() : null; } catch (e) { S.sg = null; }
        try { const r3 = await fetch('/api/semantic', { cache: 'no-store' }); S.sem = r3.ok ? await r3.json() : null; } catch (e) { S.sem = null; }
        el('status-panel').hidden = true; el('task-section').hidden = false;
        renderNotes();
        if (!S.sg || !S.sg.schema) el('notes').prepend(node('p', 'sg-missing', '逐段数据缺失：subgoals.json 未生成或为空（subgoal_lengths.py），总表与逐段表无内容。'));
        const ol = el('outlier-link');
        if (S.sg && S.sg.episodes) { ol.hidden = false; el('outlier-count').textContent = `${outliers().length} 段`; }
        ol.addEventListener('click', () => { el('sidebar').classList.remove('is-open'); showOutliers(); });
        const sml = el('semantic-link');
        const semChanged = semAll();
        if (S.sem && S.sem.tasks) { sml.hidden = false; el('semantic-count').textContent = `${semChanged.length} 格有调整 · 调整前后对照`; }
        sml.addEventListener('click', () => { el('sidebar').classList.remove('is-open'); showView('semantic'); });
        if (location.hash === '#view=semantic' && S.sem && S.sem.tasks) { showView('semantic'); return; }
        const ovl = el('overall-link'); ovl.hidden = false;
        ovl.addEventListener('click', () => { el('sidebar').classList.remove('is-open'); showView('overall'); });
        if (location.hash === '#view=overall') { showView('overall'); return; }
        const orl = el('oracle-link');
        if (S.sg && S.sg.oracle) orl.hidden = false;
        orl.addEventListener('click', () => { el('sidebar').classList.remove('is-open'); showView('oracle'); });
        if (location.hash === '#view=outliers' && S.sg) { showOutliers(); return; }
        if (location.hash === '#view=oracle' && S.sg && S.sg.oracle) { showView('oracle'); return; }
        const h = readHash();
        const task = S.cat.tasks.some(t => t.id === h.task) ? h.task : S.cat.tasks[0].id;
        select(task, h.tier, h.ep);
      } catch (err) {
        el('status-panel').textContent = '目录载入失败：' + err.message;
      }
    }
    el('task-search').addEventListener('input', renderNav);
    el('menu-toggle').addEventListener('click', () => el('sidebar').classList.toggle('is-open'));
    window.addEventListener('hashchange', () => { if (!S.cat) return; if (location.hash === '#view=outliers') { if (S.sg) showOutliers(); return; } if (location.hash === '#view=oracle') { if (S.sg) showView('oracle'); return; } if (location.hash === '#view=overall') { showView('overall'); return; } if (location.hash === '#view=semantic') { if (S.sem) showView('semantic'); return; } const h = readHash(); if (h.task && (h.task !== S.task || h.tier !== S.tier || h.ep !== S.ep)) select(h.task, h.tier, h.ep); });
    load();
  </script>
</body>
